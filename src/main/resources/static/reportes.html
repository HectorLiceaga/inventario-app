<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes</title>
    <link rel="stylesheet" href="style.css?v=1.6"> </head>
<body>
<div class="main-container">
    <div class="columna-izquierda">
        <h1>Reportes</h1>

        <div class="filtro-fechas">
            <label for="fechaDesde">Desde:</label>
            <input type="date" id="fechaDesde">
            <label for="fechaHasta">Hasta:</label>
            <input type="date" id="fechaHasta">
            <button id="filtrarBtn">Filtrar</button>
        </div>

        <h2>Ventas Filtradas</h2>
        <div class="total-ventas">
            <strong>Total Vendido: $<span id="totalVendido">0.00</span></strong>
        </div>
        <div id="ventas-container">Cargando ventas...</div>
        <a href="index.html">Volver al POS</a>
    </div>
    <div class="columna-derecha">
        <h2>Alerta de Bajo Stock</h2>
        <div id="bajo-stock-container">Cargando stock...</div>
    </div>
</div>
<script src="reportes.js?v=1.7"></script> </body>
</html>
